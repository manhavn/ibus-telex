# The musl targets link with the LLD that ships with the toolchain, so a cross
# build needs no C toolchain for the target architecture at all:
#   cargo build --release --target aarch64-unknown-linux-musl
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
